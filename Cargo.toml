[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/protocol",
    "crates/journal",
    "crates/pipeline",
    "crates/gateway",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = false
debug-assertions = false
incremental = false

# Simulation runs are long; without optimization a seed takes minutes instead of seconds.
[profile.test]
opt-level = 2
