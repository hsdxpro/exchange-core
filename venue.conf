# Venue configuration. Every setting here is validated at startup: an unknown
# key or a value that cannot work stops the venue before it accepts an order,
# rather than surfacing as strange behaviour under load.

# What to listen on. Overridden by --listen.
listen = 127.0.0.1:7070

# Journal file. Leave it out to keep the journal in memory, which is for
# measurement only -- an in-memory log measures the venue, a file measures the
# disk.
journal = venue.log

# Snapshot file. Leave it out to never snapshot, which recovers identically and
# only slower, since the journal is always the source of truth.
snapshot = venue.snap

# How long a restart may take. This is the setting an operator has an opinion
# about; the snapshot cadence is derived from it.
target_recovery_ms = 2000

# Commands a second this machine replays at, which turns the recovery target
# into a snapshot cadence. Measure it with `cargo x latency` on the machine that
# will run the venue: a rate taken from someone else's hardware is a guess
# wearing a number.
replay_rate = 7600000

# Events each subscription channel keeps for a client that reconnects: how long a
# client may be disconnected before it needs a fresh snapshot. The cost is 64
# bytes per event per channel, and there are two public channels per instrument,
# so this multiplies by the instrument list. 8,192 events is 512 KiB a channel,
# or 1 GiB across a thousand instruments. At 65,536 the same venue would want
# 7.8 GiB, which is why the budget below exists.
retained_per_channel = 8192

# Ceiling on what the feed may hold. Checked against the line above and the
# instrument list, so a venue that would not fit refuses to start instead of
# being killed under load.
max_feed_memory_mb = 64

# Commands one session may hand the venue in a single pass. Bounds the events one
# group can produce and shares the venue fairly between sessions.
max_records_per_session = 4096

# Connections held at once. Sessions are found by readiness notification, so an
# idle connection costs about 23 ns per pass -- measured, and 18x cheaper than
# the 422 ns it cost when every socket was read every pass. The residue is
# userspace, not syscalls.
#
# It is still linear and still lands in the same pass as real orders, so a
# ceiling still exists: 4,096 connections is roughly 94 us of scanning in front
# of an order. Past it the venue refuses and counts the refusals, rather than
# accepting everyone and serving them all slowly.
max_sessions = 4096

# Followers to replicate to, one line each. With none, the venue is a lone
# leader and durability is its own disk. With followers, a group is acknowledged
# once a majority holds it, which measured 53 times faster than a local fsync.
# replica = 10.0.0.2:7100
# replica = 10.0.0.3:7100

# This leader's term. It must increase every time leadership moves: a follower
# refuses anything from a term older than the highest it has seen, which is what
# stops a replaced leader writing over a newer one's data and two leaders
# acknowledging orders into logs that diverge. Whatever performs the promotion
# owns this number. A lone leader can leave it at 1 forever.
term = 1

# How long the leader waits for a follower to confirm before treating it as
# failed. Longer than the real round trip, or healthy followers look dead. A
# crashed follower is noticed at once; this is for one that hangs.
ack_timeout_ms = 250

# Whether a session must prove which account it acts for. `required` or `open`,
# and there is no default: a venue that is open because a line was forgotten
# reads exactly like one that is open on purpose, and the two could not be
# further apart. `open` is for measurement runs and the load harness only.
#
# The transport carries no TLS, deliberately, so the secret is never sent. The
# venue puts a fresh 16-byte nonce on the wire the moment a connection is
# accepted, and the client returns HMAC-SHA256 of it. Anyone reading the wire
# learns a nonce that will never be issued again and a tag that answers it, and
# neither is worth anything.
#
# What this does NOT do is protect the orders that follow. Identity is
# established at connect; the session after it is neither encrypted nor
# authenticated, so an attacker who can write to the wire can still inject. That
# is the accepted cost of an unencrypted transport, and the answer is a private
# link -- which is the deployment this transport was chosen for.
authentication = required

# One block per account allowed to connect. The secret is 32 bytes as 64 hex
# characters, and it never crosses the wire.
[credential]
account = 1
secret = 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff

# How fast one account may send, and how much it may bank by staying quiet. Both
# or neither: a rate with no burst refuses the opening quotes every market maker
# sends after a print, and a burst with no rate never refills.
#
# Per account rather than per connection, so opening ten sessions does not buy
# ten times the rate. The allowance refills once per pass rather than once per
# command -- a client that sends a thousand orders in one write costs one clock
# reading, not a thousand -- so what a command pays here is a compare and a
# decrement. Leave both out for no limit, which costs nothing at all.
#
# Enforced in the gateway, before sequencing, so a discarded command never
# reaches the journal and replay never has to ask what time it was.
max_commands_per_second = 50000
burst_commands = 1000

# Whether to stamp arrival and match times onto commands and acknowledgements.
# Two wall-clock readings a pass, shared by every command in the group -- so it
# vanishes under load and is worth about a quarter of a pass when the group is
# one. `on` unless a deployment says otherwise: a venue that owes anybody a
# traceable timestamp should not have to remember to ask for one.
#
# The arrival time is stamped before sequencing and travels inside the command,
# so a replay reproduces it rather than reading a clock. The match time is not
# journalled -- there is no room for it in a 64-byte command -- so a recovered
# venue re-emits it as zero, which is honest: it is a measurement of the run,
# not a fact about the order.
#
# Resolution is the pass, not the packet. True per-packet arrival has to come
# from the NIC (SO_TIMESTAMPING); a reading taken here measures our own
# scheduling as well as the network.
timestamps = on

# One block per listed instrument.
[instrument]
symbol = 1
base = 1
quote = 2
# Lowest price the instrument accepts. The ladder covers 65,536 ticks from here,
# and that range IS the price band: a price it cannot address is refused.
floor_ticks = 10000
max_quantity = 1000000
# Orders that may rest at once, across all prices and both sides. 40 bytes per
# slot up front plus about 15 more per live order, so a million is about 57 MiB.
max_open_orders = 1000000
