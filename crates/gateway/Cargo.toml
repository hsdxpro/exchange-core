[package]
name = "bx-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Session handling, wire framing, and the group-commit loop"

[dependencies]
bx-protocol = { path = "../protocol" }
bx-journal = { path = "../journal" }
bx-pipeline = { path = "../pipeline" }
# Used by the `venue` binary only, never by this library: it brings a consensus
# implementation and an async runtime, and neither may come anywhere near the
# matching path. The separation is enforced by the library not importing it.
bx-election = { path = "../election" }
zerocopy = { version = "0.8", features = ["derive"] }
# Readiness notification: epoll on Linux, IOCP on Windows, kqueue on the BSDs.
# Without it the loop reads every session every pass, which measured 428 ns per
# idle connection and capped a gateway at a few hundred clients. Hand-rolling
# per-platform readiness is not a thing to hand-roll.
mio = { version = "1", features = ["os-poll", "net"] }
# Authentication. The venue takes no TLS by design, so a bearer token would be
# replayable by anyone on the wire; the client signs a per-connection nonce
# instead and the secret is never sent. HMAC-SHA256 is the standard construction
# for exactly that, and hand-rolling a MAC is in the same category as
# hand-rolling consensus. Both crates are RustCrypto, and they reach the gateway
# only -- authentication happens before the sequencer, so nothing here can touch
# the deterministic path.
hmac = "0.12"
sha2 = "0.10"
# A nonce a client cannot predict has to come from the OS. `getrandom` is the
# thin syscall wrapper underneath every Rust RNG, and it is all that is wanted:
# there is no distribution to sample, just sixteen bytes.
getrandom = "0.3"

[lints]
workspace = true
