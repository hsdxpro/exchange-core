[package]
name = "bx-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Session handling, wire framing, and the group-commit loop"

[dependencies]
bx-protocol = { path = "../protocol" }
bx-journal = { path = "../journal" }
bx-pipeline = { path = "../pipeline" }
# Used by the `venue` binary only, never by this library: it brings a consensus
# implementation and an async runtime, and neither may come anywhere near the
# matching path. The separation is enforced by the library not importing it.
bx-election = { path = "../election" }
zerocopy = { version = "0.8", features = ["derive"] }
# Readiness notification: epoll on Linux, IOCP on Windows, kqueue on the BSDs.
# Without it the loop reads every session every pass, which measured 428 ns per
# idle connection and capped a gateway at a few hundred clients. Hand-rolling
# per-platform readiness is not a thing to hand-roll.
mio = { version = "1", features = ["os-poll", "net"] }
# Authentication. The client signs a per-connection nonce and the key never
# crosses the wire. Asymmetric rather than an HMAC, which is what this used to
# be: an HMAC secret is symmetric, so whoever reads the venue's key file can
# forge every account's logon, while here the venue holds only public keys and a
# breach of its configuration yields nothing signable. Binance deprecated its
# HMAC keys for the same reason.
#
# Reaches the gateway only -- authentication happens before the sequencer, so
# nothing here can touch the deterministic path, and it runs once per connection
# rather than per order.
ed25519-dalek = "3"
# A nonce a client cannot predict has to come from the OS. `getrandom` is the
# thin syscall wrapper underneath every Rust RNG, and it is all that is wanted:
# there is no distribution to sample, just sixteen bytes.
getrandom = "0.3"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[dev-dependencies]
# Tests only. `over_tcp` pins a client's receive buffer small so that "a client
# that cannot absorb the feed" is true on every platform rather than only on
# whichever one buffers least. Already in the tree underneath `mio`, and the
# alternative is per-platform `setsockopt` through FFI, which this workspace
# forbids.
socket2 = "0.6"

[lints]
workspace = true
