[package]
name = "bx-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Session handling, wire framing, and the group-commit loop"

[dependencies]
bx-protocol = { path = "../protocol" }
bx-journal = { path = "../journal" }
bx-pipeline = { path = "../pipeline" }
zerocopy = { version = "0.8", features = ["derive"] }
# Readiness notification: epoll on Linux, IOCP on Windows, kqueue on the BSDs.
# Without it the loop reads every session every pass, which measured 428 ns per
# idle connection and capped a gateway at a few hundred clients. Hand-rolling
# per-platform readiness is not a thing to hand-roll.
mio = { version = "1", features = ["os-poll", "net"] }
# QUIC. Order entry and each market-data channel get their own stream, so a
# client reading its feed slowly cannot back up its own order acknowledgements --
# which one TCP socket carrying both cannot avoid. rustls-ring rather than the
# default backend to keep the crypto dependency to one well-known implementation.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
