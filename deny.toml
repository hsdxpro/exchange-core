# Supply-chain checks, so "no known vulnerable dependencies" is something CI
# verifies rather than something nobody looked at.
#
# This venue's dependency list is short and every entry is justified where it is
# declared. That makes the check cheap and makes a new advisory or a new licence
# impossible to miss.

[advisories]
# A crate with a filed advisory fails the build. `unmaintained` is a warning
# rather than a failure: a crate can be finished rather than abandoned, and
# treating the two the same means the check gets ignored.
yanked = "deny"
unmaintained = "workspace"

[bans]
# Two versions of the same crate in one binary is usually somebody's transitive
# dependency lagging, and it is worth seeing rather than failing over.
multiple-versions = "warn"
# A dependency pinned to `*` accepts whatever is published next, which is how a
# build stops being reproducible and how a supply-chain change arrives without
# anyone choosing it.
wildcards = "deny"
# Except between the crates in this workspace. `{ path = "../protocol" }` carries
# no version because it is not published, and there is nothing to pin to: the
# path *is* the version. Counting those as wildcards flagged every internal
# dependency and would have meant either fake version numbers or turning the
# check off entirely.
allow-wildcard-paths = true

[licenses]
# Permissive only, and exactly the set this dependency tree actually uses. A
# copyleft dependency in a venue that may be distributed as a binary is a
# decision for a person, not something to discover at release -- and an allow
# list padded with licences nothing uses hides the moment a new one arrives.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    # rustls and the ring provider underneath the TLS 1.3 listener. ISC is
    # functionally MIT with fewer words; it arrived with encryption, not by
    # accident, and the comment is here so the next licence still stands out.
    "ISC",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
